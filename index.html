<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghar ka Hisaab — Grocery Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- AUTH GATE -->
<div class="gate" id="gate">
  <h1 style="font-family:'Fraunces',serif;">Ghar ka Hisaab</h1>
  <p id="authSubtitle">Log in to your account</p>

  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" style="width:100%;margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--line);">
    <input type="password" id="loginPassword" placeholder="Password" style="width:100%;margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--line);">
    <button class="gate-btn primary" id="loginBtn">Log in</button>
    <div id="loginError" style="color:var(--rust);font-size:12px;margin:6px 0;"></div>
    <p style="font-size:13px;color:var(--ink-soft);">New here? <a href="#" id="showSignup">Create an account</a></p>
  </div>

  <div id="signupForm" style="display:none;">
    <input type="text" id="signupName" placeholder="Your name" style="width:100%;margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--line);">
    <input type="email" id="signupEmail" placeholder="Email" style="width:100%;margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--line);">
    <input type="password" id="signupPassword" placeholder="Password (6+ characters)" style="width:100%;margin-bottom:8px;padding:10px;border-radius:8px;border:1px solid var(--line);">
    <button class="gate-btn primary" id="signupBtn">Create account</button>
    <div id="signupError" style="color:var(--rust);font-size:12px;margin:6px 0;"></div>
    <p style="font-size:13px;color:var(--ink-soft);">Already have an account? <a href="#" id="showLogin">Log in</a></p>
  </div>
</div>

<!-- MAIN APP -->
<div class="wrap hidden" id="app">
  <header>
    <h1>Ghar ka Hisaab</h1>
    <button class="role-badge" id="switchRoleBtn"></button>
  </header>
  <div class="sub" id="dateLabel"></div>
  <div id="bannerArea"></div>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="week">This week</button>
    <button class="tab" data-tab="month">This month</button>
  </div>

  <!-- TODAY -->
  <div id="tab-today">
    <div class="card" id="addCard">
      <h2>Add to today's list</h2>
      <div class="row" style="margin-bottom:8px;">
        <select id="catSelect" class="field"></select>
        <input type="text" id="itemInput" class="field" placeholder="Item name" list="itemSuggestions">
        <datalist id="itemSuggestions"></datalist>
      </div>
      <div class="row">
        <input type="number" id="qtyInput" class="field" placeholder="Qty needed" min="0" step="0.1">
        <select id="unitSelect" class="field">
          <option>kg</option><option>g</option><option>l</option><option>ml</option>
          <option>pcs</option><option>dozen</option><option>packet</option>
        </select>
        <button class="btn-primary" id="addBtn">Add</button>
      </div>
    </div>

    <div class="row" id="filterChips" style="margin-bottom:4px;"></div>

    <div class="card" id="listCard">
      <h2>Items</h2>
      <div id="listContainer"></div>
    </div>

    <div class="receipt">
      <div class="receipt-row"><span id="pendingCount">0 pending</span><span id="doneCount">0 purchased</span></div>
      <div class="receipt-total"><span>Today's total</span><span id="todayTotal">₹0</span></div>
    </div>
  </div>

  <!-- WEEK -->
  <div id="tab-week" style="display:none;"></div>

  <!-- MONTH -->
  <div id="tab-month" style="display:none;"></div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js" type="module"></script>
</body>
</html>
